    <script src="mouseanimation.js"></script>
    <script src="particle.js"></script>
    <script>
        async function loadLeaderboard() {
            try {
                const res = await fetch("https://api.sitedeltadarkrp.fr/leaderboard");
                const data = await res.json();

                const container = document.getElementById("leaderboard");
                container.innerHTML = "";

                if (data.length === 0) {
                    container.innerHTML = "<p>Aucune donnée.</p>";
                    return;
                }

                data.forEach((player, index) => {
                    const hours = Math.floor(player.totalPlayTime / 3600);
                    const minutes = Math.floor((player.totalPlayTime % 3600) / 60);

                    container.innerHTML += `
                        <div class="leaderboard-row">
                            <span class="rank">#${index + 1}</span>
                            <span class="pseudo">${player.pseudo}</span>
                            <span class="time">${hours}h ${minutes}m</span>
                        </div>
                    `;
                });

            } catch (err) {
                document.getElementById("leaderboard").innerHTML =
                    "<p>Erreur de chargement du leaderboard</p>";
                console.error(err);
            }
        }

        loadLeaderboard();

        setInterval(loadLeaderboard, 30000);
</script>
