<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Site-Delta DarkRP - Login</title>
  <link rel="stylesheet" href="css/style-log.css">
  <script src="https://kit.fontawesome.com/6ce492d5d4.js" crossorigin="anonymous"></script>
</head>
<body>

    <section>
        <h1>Connexion</h1>
        <div class="input-box">
            <input type="text" placeholder="Nom utilisateur">
            <i class="fa-solid fa-user"></i>  
        </div>
        <div class="input-box">
            <input type="password" placeholder="Mot de passe">
            <i class="fa-solid fa-lock"></i>
        </div>
        <div class="remember-forgot">
            <label>
                <input type="checkbox"> Se souvenir de moi
            </label>
            <a href="">Mot de passe oublié ?</a>
        </div>
        <button class="login-btn">Se connecter</button>
        <div class="register-link">
            <p>Pas de compte ? <a href="reg.html">Inscription</a></p>
        </div>
        <div class="back">
            <p><a href="index.html">Retour à l'accueil</a></p>
        </div>
    </section>
    
    <footer class="footer">
        <p>© 2025 Site-Delta DarkRP. Tous droits réservés. | Fondé par Ysuzen et Vip3r le 01/10/2025</p>
    </footer>

</body>
</html>
