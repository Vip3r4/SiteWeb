    <script src="mouseanimation.js"></script>
    <script src="particle.js"></script>
    <script src="scpinfo.js"></script>
    <script>
        async function updatePlayerCount() {
            try {
                const res = await fetch("https://api.sitedeltadarkrp.fr/count");
                const data = await res.json();
                document.getElementById("playerCount").textContent = `${data.players}/40`;
            } catch (err) {
                console.error("Impossible de récupérer le nombre de joueurs", err);
                document.getElementById("playerCount").textContent = "--/40";
            }
        }
        
        setInterval(updatePlayerCount, 5000);
        updatePlayerCount();
    </script>
