<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Site-Delta DarkRP - Login</title>
  <link rel="stylesheet" href="css/style-log.css">
  <script src="https://kit.fontawesome.com/6ce492d5d4.js" crossorigin="anonymous"></script>
</head>
<body>

    <section>
        <h1>Inscription</h1>
        <div class="input-box">
            <input type="text" placeholder="Nom utilisateur">
            <i class="fa-solid fa-user"></i>  
        </div>
        <div class="input-box">
            <input type="password" placeholder="Email">
            <i class="fa-solid fa-at"></i>
        </div>
        <div class="input-box">
            <input type="password" placeholder="Mot de passe">
            <i class="fa-solid fa-lock"></i>
        </div>
        <div class="input-box">
            <input type="password" placeholder="Confirmation du mot de passe">
            <i class="fa-solid fa-lock"></i>
        </div>
        <button class="login-btn">S'inscrire</button>
        <button class="login-discord">S'inscrire avec Discord <i class="fa-brands fa-discord"></i></button>

        <div class="register-link">
            <p>Déjà un compte ? <a href="login.html">Connexion</a></p>
        </div>
        <div class="back">
            <p><a href="index.html">Retour à l'accueil</a></p>
        </div>
    </section>

    <footer class="footer">
        <p>© 2025 Site-Delta DarkRP. Tous droits réservés. | Fondé par Ysuzen et Vip3r le 01/10/2025</p>
    </footer>
    
</body>
</html>
